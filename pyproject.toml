[project]
name = "personal-assistant"
version = "0.1.0"
description = "Self-hosted personal assistant connected to Telegram, powered by Gemini multimodal AI, and integrated with Google Calendar, Meet, and Sheets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "google-genai>=1.0.0",
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "gspread>=6.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "apscheduler>=3.10.4",
    "aiosqlite>=0.20.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
