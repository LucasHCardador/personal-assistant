services:
  assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials

  daily-appointments-cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: personal-assistant-cron
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - ./credentials:/app/credentials

  docs:
    image: zensical/zensical:latest
    container_name: personal-assistant-docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8001}:8000"
    volumes:
      - .:/docs
