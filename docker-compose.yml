services:
  assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-assistant
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials

  docs:
    image: zensical/zensical:latest
    container_name: personal-assistant-docs
    profiles:
      - docs
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
